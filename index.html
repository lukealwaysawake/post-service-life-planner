<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e9eee9"><meta name="robots" content="noindex, nofollow"><meta name="description" content="한국에서 타이베이까지, 주간 캘린더와 칸반으로 보는 새로운 생활의 리듬.">
  <title>New Season — Luke의 생활 캘린더</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><script src="seed.js" defer></script><script src="app.js" defer></script>
</head>
<body><a class="skip-link" href="#main">본문으로</a><div class="app-shell">
<aside class="sidebar" aria-label="주요 메뉴"><a class="brand" href="#calendar" aria-label="New Season 캘린더"><span class="brand-mark">L</span><span>NEW<br>SEASON</span></a><nav aria-label="보기 선택"><button class="nav-item is-active" data-view="calendar" aria-pressed="true" type="button"><span>01</span>캘린더</button><button class="nav-item" data-view="board" aria-pressed="false" type="button"><span>02</span>칸반</button></nav><div class="sidebar-note"><span class="pulse"></span><p>전역 후 첫 계절<br><strong>삶을 다시 고르는 중</strong></p></div></aside>
<main id="main"><header class="topbar"><div><p class="eyebrow">LUKE / NOV 2026 — MAR 2027</p><h1 id="page-title">한 주의 리듬</h1></div><div class="top-actions"><div class="phase-switch" role="group" aria-label="생활 단계"><button type="button" class="phase-btn is-active" data-phase="korea" aria-pressed="true">한국 · 12–2월</button><button type="button" class="phase-btn" data-phase="taipei" aria-pressed="false">타이베이 · 2–3월</button></div><button class="primary-btn" id="add-task" type="button">+ 카드 추가</button></div></header>
<div class="intro-row"><p id="phase-copy"></p><div class="legend" aria-label="분류 색상"><span><i class="study"></i>중국어</span><span><i class="body"></i>운동</span><span><i class="culture"></i>취미·사람</span><span><i class="life"></i>생활</span><span><i class="rest"></i>회복</span></div></div>
<section class="week-toolbar" aria-label="주간 선택"><div class="week-picker"><button type="button" id="prev-week" aria-label="이전 주">←</button><label class="sr-only" for="week-select">보고 싶은 주</label><select id="week-select"></select><button type="button" id="next-week" aria-label="다음 주">→</button></div><div class="week-meta"><span id="calendar-meta"></span><span id="week-progress" aria-live="polite"></span></div></section><p id="assumption" class="assumption"></p><div id="storage-warning" role="alert" hidden></div>
<section id="calendar-view" class="view is-active" aria-labelledby="page-title"><div class="mobile-calendar-switch" role="group" aria-label="모바일 캘린더 보기"><button type="button" class="is-active" data-calendar-mode="day" aria-pressed="true">일간</button><button type="button" data-calendar-mode="week" aria-pressed="false">주간</button></div><div class="mobile-days" id="mobile-days" role="group" aria-label="요일 선택"></div><div class="view-hint"><span>칸을 눌러 수정 · 체크하면 칸반에도 반영</span><span id="timezone-label"></span></div><div class="calendar-wrap" tabindex="0" aria-label="주간 시간표"><div class="week-grid" id="week-grid"></div></div><div class="weekly-agenda" id="weekly-agenda" aria-label="7일 주간 일정" hidden></div></section>
<section id="board-view" class="view" aria-labelledby="page-title" hidden><div class="board-controls"><div class="segmented" role="group" aria-label="칸반 대상"><button type="button" data-scope="week" aria-pressed="true" class="is-active">이번 주 일정</button><button type="button" data-scope="projects" aria-pressed="false">준비할 일</button></div><span class="view-hint">상태를 바꾸면 일정의 완료 표시에도 바로 반영돼</span></div><div class="board-status-tabs" id="board-status-tabs" role="tablist" aria-label="상태 선택"></div><div class="board" id="board"></div></section>
<div class="season-strip" id="season-strip"></div><footer><p><strong>이 브라우저에 자동 저장</strong> · 다른 기기와 자동 동기화되지 않아.<br>공개된 기본 계획을 바탕으로, 네 수정은 이 브라우저에만 남아.</p><div class="backup-actions"><button type="button" id="export-data">백업 받기</button><button type="button" id="import-data">백업 가져오기</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></footer></main></div>
<dialog id="task-dialog" aria-labelledby="dialog-title"><form id="task-form"><div class="sheet-handle" aria-hidden="true"></div><div class="dialog-head"><div><p class="eyebrow" id="dialog-caption">NEW CARD</p><h2 id="dialog-title">삶에 하나 더하기</h2></div><button type="button" id="close-dialog" aria-label="닫기">×</button></div><p class="form-help" id="edit-scope">선택한 주에만 반영돼.</p><label>할 일<input name="title" required maxlength="80" autocomplete="off" placeholder="예: 테니스 체험 레슨"></label><label>시간 또는 부제<input name="time" maxlength="60" placeholder="예: 14:00–15:00"></label><label>메모<textarea name="note" maxlength="300" placeholder="다음 행동이나 기억할 것"></textarea></label><div class="form-row"><label>분류<select name="kind"><option value="study">중국어</option><option value="body">운동</option><option value="culture">취미·사람</option><option value="life">생활</option><option value="rest">회복</option></select></label><label>상태<select name="status"><option value="ideas">나중에</option><option value="soon">예정</option><option value="doing">진행 중</option><option value="done">완료</option></select></label></div><div class="form-row"><label>요일<select name="day"><option value="">일정 없이 준비할 일로</option><option>월</option><option>화</option><option>수</option><option>목</option><option>금</option><option>토</option><option>일</option></select></label><label>시간대<select name="part"><option>오전</option><option>오후</option><option>저녁</option><option>밤</option></select></label></div><div class="dialog-actions"><button class="delete-btn" type="button" id="delete-task" hidden>카드 삭제</button><button class="submit-btn" type="submit">저장</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"><span></span><button type="button" hidden>되돌리기</button></div><noscript>일정 수정과 저장을 사용하려면 브라우저에서 JavaScript를 켜줘.</noscript></body></html>
